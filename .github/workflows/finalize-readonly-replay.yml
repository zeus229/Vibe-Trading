name: Finalize readonly replay candidate

on:
  push:
    branches:
      - fix/readonly-replay-after-microcompact
    paths:
      - .github/workflows/finalize-readonly-replay.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readonly-replay-after-microcompact
          fetch-depth: 0
      - name: Keep replay payload bounded like normal tool results
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('agent/src/agent/loop.py')
          text = path.read_text(encoding='utf-8')
          old = '                messages.append(context.format_tool_result(tc.id, tc.name, cached))\n'
          new = '                messages.append(context.format_tool_result(tc.id, tc.name, truncate_tool_result(cached)))\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one replay append, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python -m py_compile agent/src/agent/loop.py agent/src/agent/tool_progress.py agent/tests/test_readonly_replay_after_microcompact.py
      - name: Commit final candidate
        shell: bash
        run: |
          rm .github/workflows/finalize-readonly-replay.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/src/agent/loop.py .github/workflows/finalize-readonly-replay.yml
          git commit -m "fix(agent): bound replayed tool result context"
          git push origin HEAD:fix/readonly-replay-after-microcompact
