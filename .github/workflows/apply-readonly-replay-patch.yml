name: Apply readonly replay candidate

on:
  push:
    branches:
      - fix/readonly-replay-after-microcompact
    paths:
      - .github/workflows/apply-readonly-replay-patch.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readonly-replay-after-microcompact
          fetch-depth: 0
      - name: Patch run-scoped readonly replay
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          loop_path = Path('agent/src/agent/loop.py')
          text = loop_path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one match, got {count}: {old[:120]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              '        self._called_identical: dict[tuple[str, str], str] = {}\n        self._tool_progress = ToolProgress()\n',
              '        self._called_identical: dict[tuple[str, str], str] = {}\n'
              '        # Successful non-repeatable readonly results are retained only for\n'
              '        # this run. If compaction removes the visible result, an exact repeat\n'
              '        # can restore it without hitting the external source again.\n'
              '        self._readonly_replay_cache: dict[tuple[str, str], str] = {}\n'
              '        self._readonly_replay_ready: set[tuple[str, str]] = set()\n'
              '        self._tool_progress = ToolProgress()\n'
          )

          replace_once(
              '        self._called_identical = {}\n        self._tool_progress = ToolProgress()\n',
              '        self._called_identical = {}\n'
              '        self._readonly_replay_cache = {}\n'
              '        self._readonly_replay_ready = set()\n'
              '        self._tool_progress = ToolProgress()\n'
          )

          marker = '''            # Deterministic tools (e.g. financial_rigor calc) return the same\n            # result for the same args. Checked AFTER authorization above so a\n'''
          replay_block = '''            # A successful readonly call whose visible result was removed by\n            # micro/auto-compaction can be replayed from this run's memory. This\n            # extends the existing deterministic-cache pattern without declaring\n            # mutable web resources deterministic. Fresh/no-cache and repeatable\n            # calls deliberately bypass this path. Authorization stays above it.\n            if (\n                dedup_key is not None\n                and dedup_key in self._readonly_replay_ready\n                and self._readonly_replay_allowed(tool_def, tc.arguments)\n                and dedup_key in self._readonly_replay_cache\n            ):\n                cached = self._readonly_replay_cache[dedup_key]\n                messages.append(context.format_tool_result(tc.id, tc.name, cached))\n                self._successful_call_keys[tc.id] = dedup_key\n                self._called_ok.add(dedup_key)\n                self._readonly_replay_ready.discard(dedup_key)\n                # Restoring data that compaction removed is forward progress for\n                # the working context, but not a new external observation.\n                self._tool_progress.mark_context_restored()\n                trace.write({\n                    "type": "tool_result_replayed",\n                    "iter": iteration,\n                    "tool": tc.name,\n                    "call_id": tc.id,\n                })\n                react_trace.append({"type": "tool_result_replayed", "tool": tc.name})\n                self._emit(\n                    "tool_result",\n                    {\n                        "tool": tc.name,\n                        "status": "ok",\n                        "elapsed_ms": 0,\n                        "preview": redact_tool_result(cached)[:200],\n                        "call_id": tc.id,\n                        "cached": True,\n                        "replayed": True,\n                    },\n                )\n                continue\n\n'''
          replace_once(marker, replay_block + marker)

          readonly_method_marker = '''    def _record_written_target(self, arguments: Mapping[str, Any]) -> None:\n'''
          readonly_method = '''    def _readonly_replay_allowed(self, tool_def: Any, arguments: Mapping[str, Any]) -> bool:\n        """Whether an exact readonly result may be restored after compaction.\n\n        This is intentionally narrower than ``is_readonly``: repeatable calls\n        may be intentionally refreshed, deterministic calls already use the\n        existing cache, and ``no_cache=True`` explicitly requests a fresh read.\n        """\n        if tool_def is None or not getattr(tool_def, "is_readonly", False):\n            return False\n        if getattr(tool_def, "repeatable", False):\n            return False\n        if getattr(tool_def, "deterministic", False):\n            return False\n        try:\n            if bool((arguments or {}).get("no_cache")):\n                return False\n        except AttributeError:\n            return False\n        return True\n\n'''
          replace_once(readonly_method_marker, readonly_method + readonly_method_marker)

          replace_once(
              '''        self._called_ok.difference_update(reopened)\n        return sorted({key[0] for key in reopened})\n''',
              '''        self._called_ok.difference_update(reopened)\n        self._readonly_replay_ready.update(\n            key for key in reopened if key in self._readonly_replay_cache\n        )\n        return sorted({key[0] for key in reopened})\n'''
          )

          old_cache = '''        # Cache successful deterministic results so an identical later call is\n        # served without re-execution (regression: repeated financial_rigor\n        # calcs after compaction, 2026-08-20 INTC run).\n        if success:\n            try:\n                tool_def = self.registry.get(tc.name)\n            except Exception:  # noqa: BLE001\n                tool_def = None\n            if tool_def is not None and getattr(tool_def, "deterministic", False):\n                cache_key = self._identical_call_key(tc.name, tc.arguments)\n                if cache_key is not None:\n                    self._called_identical[cache_key] = result\n'''
          new_cache = '''        # Cache successful deterministic results so an identical later call is\n        # served without re-execution (regression: repeated financial_rigor\n        # calcs after compaction, 2026-08-20 INTC run). Non-repeatable readonly\n        # results use a separate run-scoped replay cache: it is only consulted\n        # after compaction has made that exact result unreadable.\n        if success:\n            try:\n                tool_def = self.registry.get(tc.name)\n            except Exception:  # noqa: BLE001\n                tool_def = None\n            cache_key = self._identical_call_key(tc.name, tc.arguments)\n            if tool_def is not None and getattr(tool_def, "deterministic", False):\n                if cache_key is not None:\n                    self._called_identical[cache_key] = result\n            elif (\n                cache_key is not None\n                and self._readonly_replay_allowed(tool_def, tc.arguments)\n            ):\n                self._readonly_replay_cache[cache_key] = result\n'''
          replace_once(old_cache, new_cache)

          loop_path.write_text(text, encoding='utf-8')

          progress_path = Path('agent/src/agent/tool_progress.py')
          progress = progress_path.read_text(encoding='utf-8')

          def progress_replace(old: str, new: str) -> None:
              global progress
              count = progress.count(old)
              if count != 1:
                  raise SystemExit(f'expected one tool_progress match, got {count}: {old[:120]!r}')
              progress = progress.replace(old, new, 1)

          progress_replace(
              '        self._new_observation = False\n        self.stalled_iterations = 0\n',
              '        self._new_observation = False\n'
              '        self._context_restored = False\n'
              '        self.stalled_iterations = 0\n'
          )
          progress_replace(
              '''    def is_blocked(self, key: tuple[str, str]) -> bool:\n''',
              '''    def mark_context_restored(self) -> None:\n        """Mark an iteration that restored evidence removed by compaction.\n\n        A replay is not a new external observation, but it does repair the\n        model's working context. Resetting the consecutive-stall chain here\n        prevents compaction recovery itself from consuming the no-progress\n        budget.\n        """\n        self._context_restored = True\n\n    def is_blocked(self, key: tuple[str, str]) -> bool:\n'''
          )
          progress_replace(
              '''        self.stalled_iterations = (\n            0 if self._new_observation else self.stalled_iterations + 1\n        )\n        self._new_observation = False\n        return self.stalled_iterations >= NO_PROGRESS_LIMIT\n''',
              '''        made_progress = self._new_observation or self._context_restored\n        self.stalled_iterations = (\n            0 if made_progress else self.stalled_iterations + 1\n        )\n        self._new_observation = False\n        self._context_restored = False\n        return self.stalled_iterations >= NO_PROGRESS_LIMIT\n'''
          )
          progress_path.write_text(progress, encoding='utf-8')

          test_path = Path('agent/tests/test_readonly_replay_after_microcompact.py')
          test_path.write_text('''from __future__ import annotations\n\nimport threading\nfrom types import SimpleNamespace\n\nfrom src.agent.loop import AgentLoop\nfrom src.agent.tool_progress import ToolProgress\n\n\nclass _Registry:\n    def __init__(self, *, readonly=True, repeatable=False, deterministic=False):\n        self.tool = SimpleNamespace(\n            is_readonly=readonly,\n            repeatable=repeatable,\n            deterministic=deterministic,\n        )\n        self.execute_calls = 0\n\n    def get(self, name):\n        return self.tool\n\n    def execute(self, name, args):\n        self.execute_calls += 1\n        return '{"status":"ok","value":"fresh"}'\n\n\nclass _Context:\n    @staticmethod\n    def format_tool_result(call_id, name, result):\n        return {"role": "tool", "tool_call_id": call_id, "name": name, "content": result}\n\n\nclass _Trace:\n    def __init__(self):\n        self.events = []\n\n    def write(self, event):\n        self.events.append(event)\n\n\ndef _loop(registry=None):\n    loop = object.__new__(AgentLoop)\n    loop.registry = registry or _Registry()\n    loop.memory = SimpleNamespace(run_dir="/tmp/test-run")\n    loop._called_ok = set()\n    loop._successful_call_keys = {}\n    loop._called_identical = {}\n    loop._readonly_replay_cache = {}\n    loop._readonly_replay_ready = set()\n    loop._grounding = None\n    loop._cancel_event = threading.Event()\n    loop._event_callback = None\n    loop._tool_progress = ToolProgress()\n    return loop\n\n\ndef test_compaction_marks_lost_readonly_result_for_run_scoped_replay():\n    loop = _loop()\n    key = loop._identical_call_key("read_url", {"url": "https://example.test/report"})\n    assert key is not None\n    loop._called_ok.add(key)\n    loop._readonly_replay_cache[key] = '{"status":"ok","body":"report"}'\n\n    reopened = loop._unblock_lost_readonly_results([], {key})\n\n    assert reopened == ["read_url"]\n    assert key not in loop._called_ok\n    assert key in loop._readonly_replay_ready\n\n\ndef test_replay_restores_result_without_external_execution_or_stall_increment():\n    registry = _Registry()\n    loop = _loop(registry)\n    args = {"url": "https://example.test/report"}\n    key = loop._identical_call_key("read_url", args)\n    assert key is not None\n    cached = '{"status":"ok","body":"report"}'\n    loop._readonly_replay_cache[key] = cached\n    loop._readonly_replay_ready.add(key)\n\n    tc = SimpleNamespace(name="read_url", arguments=args, id="replay-1")\n    messages = []\n    trace = _Trace()\n    react_trace = []\n\n    loop._process_tool_calls([tc], _Context(), messages, trace, react_trace, 22)\n\n    assert registry.execute_calls == 0\n    assert messages[-1]["content"] == cached\n    assert key in loop._called_ok\n    assert key not in loop._readonly_replay_ready\n    assert trace.events[-1]["type"] == "tool_result_replayed"\n    assert loop._tool_progress.finish_iteration() is False\n    assert loop._tool_progress.stalled_iterations == 0\n\n\ndef test_no_cache_and_repeatable_reads_are_not_replayed():\n    loop = _loop(_Registry())\n    tool = loop.registry.get("read_url")\n    assert loop._readonly_replay_allowed(tool, {"url": "x", "no_cache": True}) is False\n\n    repeatable = _Registry(repeatable=True).get("poll")\n    assert loop._readonly_replay_allowed(repeatable, {}) is False\n\n\ndef test_mutating_tools_and_existing_deterministic_cache_stay_separate():\n    loop = _loop(_Registry(readonly=False))\n    assert loop._readonly_replay_allowed(loop.registry.get("write_file"), {}) is False\n\n    deterministic = _Registry(deterministic=True).get("financial_rigor")\n    assert loop._readonly_replay_allowed(deterministic, {}) is False\n\n\ndef test_context_restore_resets_only_the_current_stall_chain():\n    progress = ToolProgress()\n    assert progress.finish_iteration() is False\n    assert progress.stalled_iterations == 1\n\n    progress.mark_context_restored()\n    assert progress.finish_iteration() is False\n    assert progress.stalled_iterations == 0\n\n    assert progress.finish_iteration() is False\n    assert progress.stalled_iterations == 1\n''', encoding='utf-8')
          PY
      - name: Run focused tests
        shell: bash
        run: |
          cd agent
          python -m pytest -q tests/test_readonly_replay_after_microcompact.py tests/test_tool_progress.py
      - name: Remove one-shot workflow and commit candidate
        shell: bash
        run: |
          rm .github/workflows/apply-readonly-replay-patch.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/src/agent/loop.py agent/src/agent/tool_progress.py agent/tests/test_readonly_replay_after_microcompact.py .github/workflows/apply-readonly-replay-patch.yml
          git commit -m "fix(agent): replay compacted readonly results"
          git push origin HEAD:fix/readonly-replay-after-microcompact
