name: Apply readonly replay candidate v3

on:
  push:
    branches:
      - fix/readonly-replay-after-microcompact
    paths:
      - .github/workflows/apply-readonly-replay-patch-v3.yml

permissions:
  contents: write

jobs:
  patch-and-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/readonly-replay-after-microcompact
          fetch-depth: 0

      - name: Apply patch script from reviewed v2 workflow
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/apply-readonly-replay-patch-v2.yml').read_text(encoding='utf-8')
          start_marker = "          python - <<'PY'\n"
          end_marker = "\n          PY\n\n      - name: Run dependency-free candidate checks"
          start = workflow.index(start_marker) + len(start_marker)
          end = workflow.index(end_marker, start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, '<readonly-replay-patch>', 'exec'), {})
          PY

      - name: Run truly dependency-free checks
        shell: bash
        run: |
          python -m py_compile \
            agent/src/agent/loop.py \
            agent/src/agent/tool_progress.py \
            agent/tests/test_readonly_replay_after_microcompact.py
          python - <<'PY'
          from importlib.util import module_from_spec, spec_from_file_location
          from pathlib import Path

          spec = spec_from_file_location('tool_progress_standalone', 'agent/src/agent/tool_progress.py')
          module = module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)
          ToolProgress = module.ToolProgress

          progress = ToolProgress()
          assert progress.finish_iteration() is False
          assert progress.stalled_iterations == 1
          progress.mark_context_restored()
          assert progress.finish_iteration() is False
          assert progress.stalled_iterations == 0
          assert progress.finish_iteration() is False
          assert progress.stalled_iterations == 1

          loop = Path('agent/src/agent/loop.py').read_text(encoding='utf-8')
          for needle in (
              '_readonly_replay_cache',
              '_readonly_replay_ready',
              'tool_result_replayed',
              'mark_context_restored()',
              'get("no_cache")',
              '_readonly_replay_allowed',
          ):
              assert needle in loop, needle
          test_text = Path('agent/tests/test_readonly_replay_after_microcompact.py').read_text(encoding='utf-8')
          assert 'registry.execute_calls == 0' in test_text
          assert 'test_no_cache_and_repeatable_reads_are_not_replayed' in test_text
          assert 'test_mutating_tools_and_existing_deterministic_cache_stay_separate' in test_text
          print('dependency-free readonly replay checks: OK')
          PY

      - name: Commit candidate and remove one-shot workflows
        shell: bash
        run: |
          rm .github/workflows/apply-readonly-replay-patch.yml
          rm .github/workflows/apply-readonly-replay-patch-v2.yml
          rm .github/workflows/apply-readonly-replay-patch-v3.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/src/agent/loop.py agent/src/agent/tool_progress.py agent/tests/test_readonly_replay_after_microcompact.py .github/workflows/
          git commit -m "fix(agent): replay compacted readonly results"
          git push origin HEAD:fix/readonly-replay-after-microcompact
