name: Regenerate Windows dependency lock

on:
  push:
    branches:
      - fix/email-rich-report-lock
    paths:
      - ".github/workflows/regenerate-windows-lock.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/email-rich-report-lock

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Regenerate Windows lock
        shell: powershell
        run: |
          python -m pip install pip-tools==7.6.1
          python -m piptools compile --generate-hashes --allow-unsafe --resolver=backtracking --output-file=desktop/electron/requirements-windows-lock.txt agent/requirements.txt

      - name: Commit regenerated lock
        shell: powershell
        run: |
          git diff --check
          git diff --stat -- desktop/electron/requirements-windows-lock.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add desktop/electron/requirements-windows-lock.txt
          if (git diff --cached --quiet) {
            Write-Host "Windows lock already up to date."
            exit 0
          }
          git commit -m "fix(build): refresh Windows dependency lock"
          git push origin HEAD:fix/email-rich-report-lock
